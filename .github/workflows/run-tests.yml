name: tests

on:
  push:
    branches: [main, 1.x]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.4, 8.5]
        laravel: [13.*, 12.*, 11.*]
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - laravel: 11.*
            php: 8.5
        include:
          - laravel: 13.*
            constraint: ^13.0
            testbench: 11.*
          - laravel: 12.*
            constraint: ^12.23.2
            testbench: 10.*
          - laravel: 11.*
            constraint: ^11.31
            testbench: 9.*
          - os: windows-latest
            php: 8.4
            laravel: 13.*
            constraint: ^13.0
            testbench: 11.*
            stability: prefer-stable

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.constraint }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  tests:
    name: tests
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        run: test "${{ needs.test.result }}" = "success"
